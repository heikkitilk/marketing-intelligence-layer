[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-intelligence"
version = "0.1.0"
description = "Local, private marketing-session intelligence proof of concept"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marketing-intelligence = "marketing_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
